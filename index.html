<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>C++ — Kahoot Live | T-Racers MEC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<!-- Real Firebase SDK (compat build) -> gives us a persistent WebSocket connection
     with true realtime listeners instead of REST polling. This is the single
     biggest fix for lag between questions and for handling 30+ concurrent players. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    /* theme lifted straight from the T-Racers MEC logo: deep navy/indigo + racing red */
    --purple-1:#12002f; --purple-2:#23025d; --purple-3:#3d1690;
    --ink:#181433; --ink-2:#4a4570; --ink-3:#8b86ad;
    --paper:#ffffff; --paper-2:#f4f2fb;
    --line:#e3ddf7;
    --red:#d0060a; --red-dark:#8f0206; --blue:#1368ce; --yellow:#ffa602; --green:#26890c;
    --mono:'JetBrains Mono',monospace; --title:'Poppins',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family: var(--title);
    color: var(--ink);
    min-height:100vh;
    background: radial-gradient(1300px 900px at 15% 0%, var(--purple-3) 0%, var(--purple-2) 45%, var(--purple-1) 100%);
    overflow-x:hidden;
  }
  #app{ min-height:100vh; display:flex; flex-direction:column; }

  /* ---------- shared ---------- */
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:16px 28px; color:#fff; }
  .brand{ font-weight:800; font-size:20px; display:flex; align-items:center; gap:12px; }
  .brand img.brand-logo{ height:46px; width:46px; object-fit:contain; filter:drop-shadow(0 2px 6px rgba(0,0,0,.35)); }
  .brand span{ font-family:var(--mono); font-weight:500; opacity:.75; font-size:14px; display:block; margin-top:2px;}
  .room-pill{ font-family:var(--mono); font-weight:700; font-size:17px; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25); color:#fff; padding:8px 18px; border-radius:24px; }
  .topbar-right{ display:flex; align-items:center; gap:14px; }
  .restart-mini-btn{ font-family:var(--title); font-weight:700; font-size:15px; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25); color:#fff; padding:8px 17px; border-radius:24px; cursor:pointer; }
  .restart-mini-btn:hover{ background:var(--red); border-color:var(--red); }
  .center-wrap{ flex:1; display:flex; align-items:center; justify-content:center; padding:24px; }
  .panel{ background:var(--paper); border-radius:26px; padding:44px 40px; max-width:520px; width:100%; box-shadow:0 24px 60px rgba(10,0,40,.35); }
  .panel-logo{ display:block; height:96px; margin:0 auto 18px; object-fit:contain; }
  .panel h1{ font-size:32px; font-weight:900; margin-bottom:12px; color:var(--purple-1); text-align:center; }
  .panel p.sub{ color:var(--ink-2); font-size:17px; margin-bottom:26px; line-height:1.6; text-align:center; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:15px; font-weight:700; color:var(--ink-2); margin-bottom:7px; }
  .field input{ width:100%; font-family:var(--title); font-size:22px; font-weight:700; padding:16px 16px; border-radius:14px; border:1.5px solid var(--line); background:var(--paper-2); color:var(--ink); text-align:center; letter-spacing:2px; }
  .field input:focus{ outline:none; border-color:var(--red); }
  .btn{ display:block; width:100%; text-align:center; cursor:pointer; font-family:var(--title); font-weight:800; font-size:20px; padding:18px 22px; border-radius:16px; border:none; background:var(--red); color:#fff; transition:transform .12s ease; }
  .btn:active{ transform:scale(.97); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn.ghost{ background:transparent; color:var(--purple-2); border:1.5px solid var(--line); margin-top:10px; }
  .btn.big{ padding:22px 26px; font-size:23px; }
  .divider{ display:flex; align-items:center; gap:10px; margin:20px 0 14px; color:var(--ink-3); font-size:14px; }
  .divider::before,.divider::after{ content:""; flex:1; height:1px; background:var(--line); }
  .setup-note{ background:var(--paper-2); border-right:0; border-left:4px solid var(--red); border-radius:12px; padding:15px 17px; font-size:15px; color:var(--ink-2); margin-bottom:18px; line-height:1.7; text-align:left; }
  code.inline{ font-family:var(--mono); background:#efeaff; border-radius:4px; padding:1px 6px; font-size:14px; }

  /* ---------- host lobby ---------- */
  .lobby-wrap{ display:flex; flex-wrap:wrap; gap:30px; max-width:1100px; width:100%; align-items:stretch; justify-content:center; }
  .lobby-logo-wrap{ width:100%; display:flex; flex-direction:column; align-items:center; margin-bottom:6px; }
  .lobby-logo-wrap img{ height:150px; object-fit:contain; filter:drop-shadow(0 10px 26px rgba(0,0,0,.4)); }
  .lobby-logo-wrap .lobby-title{ color:#fff; font-weight:900; font-size:26px; text-align:center; margin-top:10px; letter-spacing:.5px; }
  .qr-card{ background:#fff; border-radius:26px; padding:30px; text-align:center; box-shadow:0 24px 60px rgba(10,0,40,.35); width:320px; }
  .qr-card #qrbox{ display:flex; justify-content:center; margin:16px 0 12px; }
  .code-big{ font-family:var(--mono); font-weight:700; font-size:46px; letter-spacing:8px; color:var(--purple-1); background:var(--paper-2); border-radius:14px; padding:14px 0; margin-top:8px; }
  .qr-card small{ color:var(--ink-2); display:block; margin-top:12px; font-size:15px; }
  .players-card{ background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2); border-radius:26px; padding:30px; width:360px; color:#fff; }
  .players-card h3{ font-size:19px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center;}
  .players-card .count{ font-family:var(--mono); background:var(--red); padding:4px 12px; border-radius:14px; font-size:16px;}
  .player-chip-list{ display:flex; flex-wrap:wrap; gap:9px; max-height:240px; overflow:auto; }
  .player-chip{ background:rgba(255,255,255,.14); border-radius:22px; padding:8px 16px; font-size:16px; font-weight:700; }
  .empty-note{ color:rgba(255,255,255,.6); font-size:16px; }

  /* ---------- host question ---------- */
  .q-wrap{ width:100%; max-width:1000px; }
  .q-head{ display:flex; align-items:center; justify-content:space-between; color:#fff; margin-bottom:18px; }
  .q-progress{ font-family:var(--mono); font-size:18px; opacity:.9; font-weight:700; }
  .timer-ring{ width:74px; height:74px; border-radius:50%; background:conic-gradient(#fff var(--pct,100%), rgba(255,255,255,.22) 0); display:flex; align-items:center; justify-content:center; }
  .timer-ring span{ width:60px; height:60px; border-radius:50%; background:var(--red); display:flex; align-items:center; justify-content:center; color:#fff; font-family:var(--mono); font-weight:700; font-size:22px; }
  /* Pinned to the right edge of the viewport (not inside the scrolling
     q-wrap) so it's always visible even on a long question with a big
     code block, instead of scrolling out of view at the top. */
  .timer-ring-fixed{ position:fixed; right:24px; top:50%; transform:translateY(-50%); z-index:60; }
  .timer-ring-fixed .timer-ring{ width:96px; height:96px; box-shadow:0 14px 30px rgba(0,0,0,.35); }
  .timer-ring-fixed .timer-ring span{ width:80px; height:80px; font-size:28px; }
  @media (max-width:640px){
    .timer-ring-fixed{ right:12px; }
    .timer-ring-fixed .timer-ring{ width:68px; height:68px; }
    .timer-ring-fixed .timer-ring span{ width:56px; height:56px; font-size:20px; }
  }
  .q-card-host{ background:#fff; border-radius:26px; padding:36px 38px; margin-bottom:20px; box-shadow:0 24px 60px rgba(10,0,40,.35); }
  .q-topic{ font-family:var(--mono); font-size:14px; font-weight:700; color:#fff; background:var(--purple-2); border-radius:8px; padding:5px 12px; display:inline-block; margin-bottom:14px;}
  .q-card-host .q-text{ font-size:30px; font-weight:800; line-height:1.5; }
  .q-card-host .q-text code{ font-family:var(--mono); font-size:23px; background:var(--paper-2); border:1px solid var(--line); border-radius:6px; padding:2px 8px; }
  /* ---------- VS Code-style code block for coding questions ---------- */
  .code-block{
    background:#1e1e1e; color:#d4d4d4; font-family:var(--mono); font-size:18px; line-height:1.55;
    border-radius:12px; padding:18px 22px; margin:16px 0 6px; text-align:left; overflow-x:auto;
    white-space:pre; box-shadow:inset 0 0 0 1px rgba(255,255,255,.08), 0 10px 26px rgba(0,0,0,.35);
  }
  .code-block .tok-kw{ color:#569cd6; }
  .code-block .tok-type{ color:#4ec9b0; }
  .code-block .tok-str{ color:#ce9178; }
  .code-block .tok-num{ color:#b5cea8; }
  .code-block .tok-com{ color:#6a9955; font-style:italic; }
  .code-block .tok-fn{ color:#dcdcaa; }
  .opt-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:10px;}
  .opt-tile{ border-radius:16px; padding:20px 20px; color:#fff; font-weight:700; font-size:21px; display:flex; align-items:center; gap:12px; line-height:1.4; }
  .opt-tile .shape{ font-size:28px; flex-shrink:0; }
  .opt-tile code{ font-family:var(--mono); font-size:18px; background:rgba(255,255,255,.18); border-radius:5px; padding:2px 7px; }
  .opt-tile.correct-flag{ outline:5px solid #fff; outline-offset:-5px; }
  .opt-tile .count-badge{ margin-left:auto; font-family:var(--mono); background:rgba(255,255,255,.25); padding:3px 12px; border-radius:12px; font-size:17px; }
  .answered-status{ text-align:center; color:#fff; font-family:var(--mono); font-size:18px; font-weight:700; margin-bottom:16px; }
  .host-actions{ display:flex; gap:14px; justify-content:center; }
  .host-actions .btn{ width:auto; padding:17px 36px; font-size:20px; }
  .explain-box{ margin-top:18px; background:var(--paper-2); border-radius:14px; padding:17px 19px; font-size:18px; color:var(--ink-2); border-left:4px solid var(--red); line-height:1.55; }

  /* ---------- leaderboard ---------- */
  .lb-wrap{ width:100%; max-width:640px; }
  .lb-title{ text-align:center; color:#fff; font-weight:900; font-size:34px; margin-bottom:26px; }
  .lb-row{ display:flex; align-items:center; gap:16px; background:#fff; border-radius:16px; padding:18px 22px; margin-bottom:12px; box-shadow:0 10px 26px rgba(10,0,40,.22); }
  .lb-rank{ font-family:var(--mono); font-weight:900; font-size:26px; width:42px; color:var(--purple-2); }
  .lb-name{ flex:1; font-weight:800; font-size:21px; }
  .lb-score{ font-family:var(--mono); font-weight:700; font-size:21px; color:var(--red); }
  .lb-row.top1{ background:linear-gradient(90deg,#fff9e6,#fff); border:2px solid var(--yellow); }

  /* ---------- player screens ---------- */
  .player-shell{ flex:1; display:flex; flex-direction:column; }
  .player-wait{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; text-align:center; padding:26px; gap:18px; }
  .player-wait img.wait-logo{ height:90px; object-fit:contain; margin-bottom:6px; filter:drop-shadow(0 8px 20px rgba(0,0,0,.35)); }
  .pulse-dot{ width:16px; height:16px; border-radius:50%; background:var(--red); animation:pulse 1.2s infinite ease-in-out; }
  @keyframes pulse{ 0%,100%{opacity:.3; transform:scale(.8);} 50%{opacity:1; transform:scale(1.15);} }
  .player-wait h2{ font-size:26px; font-weight:800; }
  .player-wait p{ font-size:17px; opacity:.9; max-width:340px; }
  .name-tag{ position:fixed; top:16px; right:16px; color:#fff; font-family:var(--mono); font-size:15px; background:rgba(255,255,255,.15); padding:8px 15px; border-radius:24px; }

  .shape-grid{ flex:1; display:grid; grid-template-columns:1fr 1fr; gap:5px; }
  .shape-btn{ border:none; display:flex; align-items:center; justify-content:center; font-size:78px; color:#fff; cursor:pointer; }
  .shape-btn:active{ filter:brightness(.85); }
  .shape-btn:disabled{ opacity:.5; }
  .mini-timer{ height:10px; background:rgba(255,255,255,.25); }
  .mini-timer-fill{ height:100%; background:var(--red); transition:width .25s linear; }

  .result-hero{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; text-align:center; gap:12px; padding:24px; }
  .result-hero .verdict{ font-size:42px; font-weight:900; }
  .result-hero .pts{ font-family:var(--mono); font-size:54px; font-weight:800; }
  .result-hero .rank-note{ font-size:19px; opacity:.9; }
  .result-hero.ok{ background:radial-gradient(1000px 700px at 50% -10%, #1fab5a, #106b3a); }
  .result-hero.bad{ background:radial-gradient(1000px 700px at 50% -10%, var(--red), var(--red-dark)); }

  .final-wrap{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; text-align:center; gap:16px; padding:24px; }
  .final-wrap img.final-logo{ height:100px; object-fit:contain; margin-bottom:4px; filter:drop-shadow(0 8px 20px rgba(0,0,0,.35)); }
  .final-wrap .big-rank{ font-family:var(--mono); font-size:80px; font-weight:900; }
  .final-wrap .big-score{ font-size:20px; opacity:.9; }

  /* ---------- podium celebration (host final results) ---------- */
  .podium-wrap{ position:relative; width:100%; max-width:760px; margin:0 auto; }
  .confetti-layer{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:5; }
  .confetti-piece{ position:absolute; top:-40px; border-radius:2px; opacity:0; animation:confettiFall linear forwards; }
  @keyframes confettiFall{
    0%{ opacity:1; transform:translateY(0) rotate(0deg); }
    100%{ opacity:1; transform:translateY(110vh) rotate(720deg); }
  }
  .podium-stage{ display:flex; align-items:flex-end; justify-content:center; gap:18px; margin:30px auto 10px; min-height:300px; }
  .podium-slot{ display:flex; flex-direction:column; align-items:center; opacity:0; transform:translateY(40px) scale(.85); width:180px; }
  .podium-slot.show{
    /* Real (non-animated) end-state values, not just relying on the
       podiumPop animation's fill-mode:forwards to "hold" opacity/transform.
       Root cause of "the winner's name appears for a second then vanishes":
       when winner-pulse is added ~400ms later, .podium-slot.rank1.winner-pulse
       (3 classes) outranks .podium-slot.show (2 classes) and REPLACES the
       whole `animation` shorthand with winnerGlow. winnerGlow only touches
       `filter`, not opacity/transform, so once podiumPop stops being the
       active animation its forwards-fill hold is gone, and opacity/transform
       fall back to the base .podium-slot rule (opacity:0, shifted down) —
       i.e. it looks like the slot disappeared. Setting them here directly
       means they hold regardless of which animation is currently running. */
    opacity:1;
    transform:translateY(0) scale(1);
    animation:podiumPop .65s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  @keyframes podiumPop{ 0%{ opacity:0; transform:translateY(40px) scale(.8);} 60%{ opacity:1; transform:translateY(-8px) scale(1.05);} 100%{ opacity:1; transform:translateY(0) scale(1);} }
  .podium-slot .medal{ font-size:44px; margin-bottom:8px; filter:drop-shadow(0 6px 14px rgba(0,0,0,.4)); }
  .podium-slot .p-name{ font-weight:800; font-size:19px; margin-bottom:6px; max-width:170px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#fff; text-shadow:0 2px 8px rgba(0,0,0,.5); }
  .podium-slot .p-score{ font-family:var(--mono); font-weight:700; font-size:16px; opacity:.95; margin-bottom:10px; color:#fff; text-shadow:0 2px 8px rgba(0,0,0,.5); }
  .podium-block{ width:100%; border-radius:14px 14px 0 0; display:flex; align-items:flex-start; justify-content:center; padding-top:14px; font-family:var(--mono); font-weight:900; color:#fff; box-shadow:0 -6px 20px rgba(0,0,0,.25); }
  .podium-slot.rank2 .podium-block{ height:130px; background:linear-gradient(180deg,#c9d3e0,#8fa0b8); font-size:34px; }
  .podium-slot.rank3 .podium-block{ height:96px; background:linear-gradient(180deg,#d99a5e,#a5652f); font-size:34px; }
  .podium-slot.rank1{ width:210px; }
  .podium-slot.rank1 .podium-block{ height:176px; background:linear-gradient(180deg,#ffe27a,#e0a51c); font-size:40px; }
  .podium-slot.rank1 .medal{ font-size:58px; }
  .podium-slot.rank1 .p-name{ font-size:24px; max-width:200px; }
  .podium-slot.rank1.winner-pulse{ animation:winnerGlow 1.4s ease-in-out infinite; }
  @keyframes winnerGlow{ 0%,100%{ filter:drop-shadow(0 0 0 rgba(255,214,0,0)); } 50%{ filter:drop-shadow(0 0 22px rgba(255,214,0,.85)); } }
  .podium-slot.rank1 .p-name{ animation:winnerNameShake .5s ease-in-out; }
  @keyframes winnerNameShake{ 0%,100%{ transform:translateX(0); } 20%{ transform:translateX(-4px); } 40%{ transform:translateX(4px); } 60%{ transform:translateX(-3px); } 80%{ transform:translateX(3px); } }
  .rest-list{ max-width:520px; margin:22px auto 0; }
  .rest-list .lb-row{ opacity:0; animation:restRowIn .4s ease forwards; }
  @keyframes restRowIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

  @media (max-width:640px){
    .panel{ padding:30px 24px; }
    .opt-grid{ grid-template-columns:1fr; }
    .lobby-wrap{ flex-direction:column; align-items:center; }
    .q-card-host .q-text{ font-size:24px; }
    .code-block{ font-size:14px; padding:14px 16px; }
    .lb-title{ font-size:28px; }
    .podium-stage{ gap:8px; }
    .podium-slot{ width:105px; }
    .podium-slot.rank1{ width:130px; }
    .podium-slot .p-name{ font-size:14px; max-width:100px; }
    .podium-slot.rank1 .p-name{ font-size:17px; max-width:125px; }
    .podium-slot .medal{ font-size:32px; }
    .podium-slot.rank1 .medal{ font-size:42px; }
    .podium-slot.rank2 .podium-block{ height:100px; font-size:24px; }
    .podium-slot.rank3 .podium-block{ height:76px; font-size:24px; }
    .podium-slot.rank1 .podium-block{ height:130px; font-size:28px; }
  }
</style>
</head>
<body>
  <div id="app"></div>

<script>
/* =======================================================================
   CONFIG — REQUIRED BEFORE THIS WORKS OUTSIDE claude.ai
   This game needs a small free real-time database so the host screen and
   every student's phone can read/write the same live game state (works
   on GitHub Pages, any static host, or even opening the file locally).
   1. Go to https://console.firebase.google.com -> create a free project
   2. Build -> Realtime Database -> Create Database -> start in TEST MODE
   3. In the Database "Rules" tab, temporarily set:
        { "rules": { ".read": true, ".write": true } }
      (fine for a short in-class quiz; turn it back off afterwards)
   4. Copy the "databaseURL" shown at the top of the Realtime Database
      page (looks like https://your-project-default-rtdb.firebaseio.com)
   5. Paste it below, replacing the placeholder string.

   NOTE: this build talks to Firebase using the real Firebase SDK (loaded
   above via <script> tags) over a single persistent WebSocket per device,
   not via one-off REST calls. Nothing extra to configure for that — it's
   automatic once FIREBASE_DB_URL below is set. This is what removes the
   lag between questions and lets the room handle 30+ players smoothly.
   ======================================================================= */

const QUESTION_MS_MIN = 15000; // shortest question/answers -> 15s
const QUESTION_MS_MAX = 25000; // longest question/answers -> 25s

/* Duration scales between MIN and MAX based on how much text the player
   has to read (question text + all 4 options). Longer text -> more time. */
function computeQuestionDuration(q){
  const textLen = (q.text||'').length + (q.options||[]).reduce((sum,o)=> sum + (o||'').length, 0);
  // Calibrated so a short question (~60 chars total) sits near the min,
  // and a long one (~260+ chars total) sits near the max.
  const MIN_LEN = 60, MAX_LEN = 260;
  const ratio = Math.min(1, Math.max(0, (textLen - MIN_LEN) / (MAX_LEN - MIN_LEN)));
  let ms = QUESTION_MS_MIN + ratio * (QUESTION_MS_MAX - QUESTION_MS_MIN);
  // A question with a code snippet needs real extra reading time on top
  // of the question/options time above — tracing through a short class
  // or a loop takes people much longer than reading an equivalent amount
  // of plain sentence text. Scale the bonus by how long the snippet is
  // (a one-liner vs. a 10-line class), so a small snippet doesn't get
  // the full bonus and a long one doesn't get short-changed.
  if(q.code){
    const CODE_LEN_MIN = 40, CODE_LEN_MAX = 300;
    const CODE_MS_MIN = 10000, CODE_MS_MAX = 20000;
    const codeRatio = Math.min(1, Math.max(0, (q.code.length - CODE_LEN_MIN) / (CODE_LEN_MAX - CODE_LEN_MIN)));
    ms += CODE_MS_MIN + codeRatio * (CODE_MS_MAX - CODE_MS_MIN);
  }
  return Math.round(ms/1000)*1000; // round to nearest whole second
}

/* Call when fully leaving a context (host changing screens, or the player
   session ending), so old DB listeners don't keep firing or pile up. */

  S._unsubs = [];
}
/* Call on every render() to stop any local-only countdown interval left
   over from the previous screen, without touching the live DB listener(s). */

}

/* ============================= REALTIME DB HELPERS (real Firebase SDK) =============================
   Switched from raw REST fetch() polling to the actual Firebase SDK. This opens ONE
   persistent WebSocket per device (host or player) instead of every screen hammering
   the database with an HTTP request every second. Two direct results:
     1) Zero-delay updates -> no more "waiting up to 1s for the next poll" lag when
        moving between question / reveal / leaderboard / next question.
     2) Far less load on the database with many players, since 30 players now hold
        30 idle WebSocket connections instead of 30 HTTP requests PER SECOND. */
let fbApp = null, fbDb = null;
function configured(){ return FIREBASE_DB_URL && !FIREBASE_DB_URL.includes('PASTE_YOUR'); }
function fbInit(){
  if(fbDb) return fbDb;
  fbApp = firebase.initializeApp({ databaseURL: FIREBASE_DB_URL });
  fbDb = firebase.database();
  return fbDb;
}
/* ---------- Synced clock across host + all player devices ----------
   Root cause of "timer runs out on the phone before the host screen /
   projector even finishes counting down": startedAt is written using
   the HOST device's Date.now(), then every player subtracts THEIR OWN
   device's Date.now() from it. If a phone's clock is even a few
   seconds off from the host laptop's clock (very common — phones and
   laptops rarely have perfectly synced clocks), the phone thinks more
   time has passed than actually has, so its countdown (and the forced
   "time's up, submitting no answer" flow) fires early.
   Fix: every device asks Firebase for the difference between the
   server's clock and its own (a built-in feature: '.info/serverTimeOffset'),
   and uses serverNow() instead of Date.now() for anything timer-related.
   Now every device — host and every phone — computes remaining time
   against the SAME server clock, so they all run out together. */
let SERVER_TIME_OFFSET = 0;
function startServerTimeSync(){
  try{ fbInit().ref('.info/serverTimeOffset').on('value', snap=>{ SERVER_TIME_OFFSET = snap.val() || 0; }); }
  catch(e){}
}
function serverNow(){ return Date.now() + SERVER_TIME_OFFSET; }

async function fbGet(path){
  try{
    const snap = await fbInit().ref(path).get();
    return snap.exists() ? snap.val() : null;
  }catch(e){ return null; }
}
async function fbSet(path, val){
  try{ await fbInit().ref(path).set(val); return true; }
  catch(e){ return false; }
}
/* Subscribe to live changes at `path`. cb(val) fires immediately with the current
   value and again every time it changes — no polling loop needed at all.
   Returns an unsubscribe() function. */
function fbListen(path, cb){
  const ref = fbInit().ref(path);
  const handler = (snap)=> cb(snap.exists() ? snap.val() : null);
  ref.on('value', handler);
  return ()=> ref.off('value', handler);
}
const metaPath = c => `rooms/${c}/meta`;
const playersPath = c => `rooms/${c}/players`;
const playerPath = (c,id) => `rooms/${c}/players/${id}`;
const answersPath = (c,q) => `rooms/${c}/answers/${q}`;
const answerPath = (c,q,id) => `rooms/${c}/answers/${q}/${id}`;
const resultPath = (c,q,id) => `rooms/${c}/results/${q}/${id}`;

function genCode(){ return String(Math.floor(1000 + Math.random()*9000)); }
function genId(){ return 'p' + Math.random().toString(36).slice(2,10); }

async function getAllPlayers(code){
  const obj = await fbGet(playersPath(code));
  if(!obj) return [];
  return Object.entries(obj).map(([id,v])=> ({ id, name:v.name, score:v.score||0 }));
}

/* ============================= RENDER ROUTER ============================= */
function render(){
  clearLocalTimers(); // stop any leftover countdown redraw loop from the previous screen
  if(S.screen === 'not-configured') return renderNotConfigured();
  if(S.screen === 'host-lobby') return renderHostLobby();
  if(S.screen === 'host-question') return renderHostQuestion();
  if(S.screen === 'host-reveal') return renderHostReveal();
  if(S.screen === 'host-leaderboard') return renderHostLeaderboard();
  if(S.screen === 'host-end') return renderHostEnd();
  if(S.screen === 'player-join') return renderPlayerJoin();
  if(S.screen === 'player-waiting') return renderPlayerWaiting();
  if(S.screen === 'player-question') return renderPlayerQuestion();
  if(S.screen === 'player-answered-wait') return renderPlayerAnsweredWait();
  if(S.screen === 'player-result') return renderPlayerResult();
  if(S.screen === 'player-end') return renderPlayerEnd();
}

/* ============================= BOOT / ROUTING (no role picker — automatic) ============================= */
async function boot(){
  if(!configured()){ S.screen='not-configured'; render(); return; }
  startServerTimeSync();

  const params = new URLSearchParams(location.search);

  if(params.get('play') === '1'){
    // Anyone opening the join link is always a player.
    S.role = 'player';
    S.screen = 'player-join';
    render();
    return;
  }

  // Default: this is the host screen. Try to resume a previous session first.
  S.role = 'host';
  const savedCode = loadHostSession();
  if(savedCode){
    const m = await fbGet(metaPath(savedCode));
    if(m){
      S.roomCode = savedCode; S.meta = m;
      if(m.status === 'lobby'){ S.screen='host-lobby'; render(); return; }
      if(m.status === 'end'){ S.screen='host-end'; render(); return; }
      S.qIndex = m.qIndex;
      S.screen = m.revealed ? 'host-leaderboard' : 'host-question';
      render();
      return;
    }
  }
  // No valid saved session — start a brand new room automatically.
  const code = genCode();
  S.roomCode = code;
  saveHostSession(code);
  await fbSet(metaPath(code), { status:'lobby', qIndex:-1, startedAt:0, duration:QUESTION_MS, revealed:false });
  S.screen = 'host-lobby';
  render();
}

function renderHostLobby(){
  clearListeners();
  const link = `${location.origin}${location.pathname}?play=1&code=${S.roomCode}`;
  app.innerHTML = `
    <div class="topbar"><div class="brand"><img class="brand-logo" src="${LOGO_DATA_URI}" alt="T-Racers MEC logo">T-Racers MEC<span>C++ Live Quiz</span></div><div class="room-pill">Room ${S.roomCode}</div></div>
    <div class="center-wrap">
      <div class="lobby-wrap">
        <div class="lobby-logo-wrap">
          <div class="lobby-title">C++ — Live Quiz</div>
        </div>
        <div class="qr-card">
          <b>Scan to join</b>
          <div id="qrbox"></div>
          <div class="code-big">${S.roomCode}</div>
          <small>Or type this code manually on the join page</small>
        </div>
        <div class="players-card">
          <h3>Students joined <span class="count" id="pcount">0</span></h3>
          <div class="player-chip-list" id="plist"><span class="empty-note">Waiting for students to scan the QR…</span></div>
          <button class="btn big" id="startBtn" style="margin-top:18px" disabled>Start Game</button>
        </div>
      </div>
    </div>`;
  const qrEl = document.getElementById('qrbox');
  qrEl.innerHTML='';
  try{ new QRCode(qrEl, { text: link, width:220, height:220, colorDark:"#23025d", colorLight:"#ffffff" }); }catch(e){}
  document.getElementById('startBtn').onclick = async ()=>{
    // Set S.meta locally FIRST, synchronously — don't wait for the live
    // listener's round-trip to confirm it. If we wait, the countdown timer
    // in renderHostQuestion can tick using the OLD (stale) startedAt for
    // up to a few hundred ms, which reads as "time's already up" and
    // reveals the question instantly. Refreshing "fixed" it before only
    // because a reload re-fetches meta fresh with fbGet() before render.
    const newMeta = { status:'question', qIndex:0, startedAt:serverNow(), duration:computeQuestionDuration(QUESTIONS[0]), revealed:false };
    S.meta = newMeta;
    await fbSet(metaPath(S.roomCode), newMeta);
    S.qIndex = 0; S.screen='host-question'; render();
  };
  // Live listener: player chip list + count update the INSTANT a student joins,
  // with no polling delay, and no matter how many students join at once.
  const unsub = fbListen(playersPath(S.roomCode), (obj)=>{
    if(S.screen!=='host-lobby') return;
    const players = obj ? Object.entries(obj).map(([id,v])=> ({ id, name:v.name, score:v.score||0 })) : [];
    const pl = document.getElementById('plist'); const pc = document.getElementById('pcount'); const sb = document.getElementById('startBtn');
    if(!pl) return;
    pc.textContent = players.length;
    sb.disabled = players.length===0;
    pl.innerHTML = players.length ? players.map(p=>`<span class="player-chip">${escapeHtml(p.name)}</span>`).join('') : '<span class="empty-note">Waiting for students to scan the QR…</span>';
  });
  S._unsubs.push(unsub);
}

/* ============================= HOST: QUESTION ============================= */
function renderHostQuestion(){
  clearListeners();
  const q = QUESTIONS[S.qIndex];
  app.innerHTML = `
    ${topbarWithRestart()}
    <div class="timer-ring-fixed">
      <div class="timer-ring" id="timerRing"><span id="timerNum">${Math.round(computeQuestionDuration(q)/1000)}</span></div>
    </div>
    <div class="center-wrap">
      <div class="q-wrap">
        <div class="q-head">
          <div class="q-progress">Question ${S.qIndex+1} / ${QUESTIONS.length}</div>
        </div>
        <div class="q-card-host">
          <span class="q-topic">${q.topic}</span>
          <div class="q-text">${q.text}</div>
          ${q.code ? `<div class="code-block">${highlightCpp(q.code)}</div>` : ''}
        </div>
        <div class="opt-grid">
          ${q.options.map((o,i)=>`<div class="opt-tile" style="background:${SHAPES[i].color}"><span class="shape">${SHAPES[i].icon}</span><span>${o}</span></div>`).join('')}
        </div>
        <div class="answered-status" id="answeredStatus" style="margin-top:16px;">0 / 0 answered</div>
        <div class="host-actions"><button class="btn" id="revealBtn">Reveal Answer Now</button></div>
      </div>
    </div>`;
  document.getElementById('revealBtn').onclick = ()=> revealAnswer();
  wireRestartBtn();

  // ---- Countdown ring: driven by ONE local setInterval that does zero network
  // calls (pure UI redraw from values already in S.meta). This avoids the old
  // "fbGet every second" pattern entirely -> no per-second request load at all,
  // for the host or for any of the players.
  let localTimer = setInterval(()=>{
    if(S.screen!=='host-question' || !S.meta){ clearInterval(localTimer); return; }
    const m = S.meta;
    const remaining = Math.max(0, m.duration - (serverNow()-m.startedAt));
    const pct = Math.round((remaining/m.duration)*100)+'%';
    const ring = document.getElementById('timerRing');
    if(ring){ ring.style.setProperty('--pct', pct); document.getElementById('timerNum').textContent = Math.ceil(remaining/1000); }
    if(remaining<=0){ clearInterval(localTimer); revealAnswer(); }
  }, 250);
  S._localTimers.push(()=> clearInterval(localTimer));

  // Keep S.meta fresh via a live listener (covers the rare case of a host
  // reconnecting / a second host tab) instead of polling it every tick.
  const unsubMeta = fbListen(metaPath(S.roomCode), (m)=>{ if(m) S.meta = m; });
  S._unsubs.push(unsubMeta);

  // Live "answered" counter: fires instantly as each student submits, and
  // scales to any number of players since it's a single subscription, not
  // N requests per second.
  const unsubAnswers = fbListen(answersPath(S.roomCode, S.qIndex), async (answers)=>{
    if(S.screen!=='host-question') return;
    const players = await getAllPlayers(S.roomCode);
    const el = document.getElementById('answeredStatus');
    const count = answers ? Object.keys(answers).length : 0;
    if(el) el.textContent = `${count} / ${players.length} answered`;
  });
  S._unsubs.push(unsubAnswers);
}

/* ---- reveal + scoring ---- */
async function revealAnswer(){
  if(S.busy) return; S.busy = true;
  const code = S.roomCode, qIdx = S.qIndex, q = QUESTIONS[qIdx];
  // These three reads don't depend on each other, so fetch them together
  // instead of one-after-another.
  const [meta, answers, players] = await Promise.all([
    fbGet(metaPath(code)).then(m=> m || { duration: QUESTION_MS }),
    fbGet(answersPath(code, qIdx)).then(a=> a || {}),
    getAllPlayers(code)
  ]);
  const tally = [0,0,0,0];
  const scored = [];
  for(const p of players){
    const ans = answers[p.id];
    const correct = !!ans && ans.choice === q.correct;
    if(ans) tally[ans.choice] = (tally[ans.choice]||0)+1;
    // Guard against a student who never answered (ans is undefined here) so
    // this can't throw on ans.time — they just score 0.
    const pts = correct ? Math.max(200, Math.round(1000 * (1 - (ans.time/(2*meta.duration))))) : 0;
    const newScore = (p.score||0) + pts;
    scored.push({ id:p.id, name:p.name, pts, correct, newScore });
  }
  scored.sort((a,b)=> b.newScore - a.newScore);

  /* ---- THE BIG FIX FOR LAG WITH MANY PLAYERS ----
     This used to be a `for` loop with `await` INSIDE it, doing two
     sequential network writes per player (score + result). With 30 players
     that meant 60 round-trips back-to-back before the host's screen could
     move to the reveal — by far the biggest source of "stuck" lag in the
     whole game, and it scaled directly with player count.
     Firing every player's writes together with Promise.all means the total
     wait is roughly ONE round-trip whether there are 3 players or 300. */
  await Promise.all(scored.flatMap((s,i)=> [
    fbSet(playerPath(code, s.id), { name:s.name, score:s.newScore }),
    fbSet(resultPath(code, qIdx, s.id), { correct:s.correct, pts:s.pts, newScore:s.newScore, rank:i+1, total:scored.length })
  ]));
  await fbSet(metaPath(code), { ...meta, revealed:true });
  S.revealTally = { tally, total: players.length };
  S.screen = 'host-reveal'; S.busy = false;
  render();
}

function renderHostReveal(){
  clearListeners();
  const q = QUESTIONS[S.qIndex];
  const tally = S.revealTally ? S.revealTally.tally : [0,0,0,0];
  const isLast = S.qIndex === QUESTIONS.length-1;
  app.innerHTML = `
    ${topbarWithRestart()}
    <div class="center-wrap">
      <div class="q-wrap">
        <div class="q-card-host">
          <span class="q-topic">${q.topic}</span>
          <div class="q-text">${q.text}</div>
          ${q.code ? `<div class="code-block">${highlightCpp(q.code)}</div>` : ''}
        </div>
        <div class="opt-grid">
          ${q.options.map((o,i)=>`<div class="opt-tile ${i===q.correct?'correct-flag':''}" style="background:${SHAPES[i].color}">
              <span class="shape">${SHAPES[i].icon}</span><span>${o}</span><span class="count-badge">${tally[i]||0}</span>
            </div>`).join('')}
        </div>
        <div class="explain-box"><b>Why:</b> ${q.explain}</div>
        <div class="host-actions" style="margin-top:20px;">
          <button class="btn" id="toLbBtn">${isLast? 'Show Final Results':'Show Leaderboard'}</button>
        </div>
      </div>
    </div>`;
  document.getElementById('toLbBtn').onclick = async ()=>{
    if(isLast){
      const m = await fbGet(metaPath(S.roomCode));
      await fbSet(metaPath(S.roomCode), { ...m, status:'end' });
      S.screen='host-end';
    } else {
      S.screen='host-leaderboard';

  wireRestartBtn();
}

/* ============================= HOST: LEADERBOARD ============================= */
function renderHostLeaderboard(){
  clearListeners();
  app.innerHTML = `
    ${topbarWithRestart()}
    <div class="center-wrap">
      <div class="lb-wrap">
        <div class="lb-title">🏆 Leaderboard</div>
        <div id="lbList">Loading…</div>
        <div class="host-actions" style="margin-top:18px;"><button class="btn big" id="nextQBtn">Next Question</button></div>
      </div>
    </div>`;
  document.getElementById('nextQBtn').onclick = async ()=>{
    const nextIdx = S.qIndex + 1;
    // Same fix as Start Game: set S.meta locally right away instead of
    // waiting for the fbListen round-trip, which is what caused the
    // "timer suddenly shows 0" bug on some question transitions.
    const newMeta = { status:'question', qIndex:nextIdx, startedAt:serverNow(), duration:computeQuestionDuration(QUESTIONS[nextIdx]), revealed:false };
    S.meta = newMeta;
    await fbSet(metaPath(S.roomCode), newMeta);
    S.qIndex = nextIdx; S.screen='host-question'; render();
  };
  wireRestartBtn();
  loadLeaderboard();
}
async function loadLeaderboard(){
  const players = await getAllPlayers(S.roomCode);
  players.sort((a,b)=> b.score-a.score);
  const top5 = players.slice(0,5);
  const el = document.getElementById('lbList');
  if(!el) return;
  const medals = ['🥇','🥈','🥉'];
  el.innerHTML = top5.map((p,i)=>`
    <div class="lb-row ${i===0?'top1':''}">
      <div class="lb-rank">${medals[i]||('#'+(i+1))}</div>
      <div class="lb-name">${escapeHtml(p.name)}</div>
      <div class="lb-score">${p.score}</div>
    </div>`).join('') || '<p style="color:#fff;text-align:center;">No players yet</p>';
}

/* ============================= HOST: END ============================= */
function renderHostEnd(){
  clearListeners();
  app.innerHTML = `
    <div class="topbar"><div class="brand"><img class="brand-logo" src="${LOGO_DATA_URI}" alt="T-Racers MEC logo">T-Racers MEC<span>C++ Live Quiz</span></div><div class="room-pill">Room ${S.roomCode}</div></div>
    <div class="center-wrap">
      <div class="lb-wrap podium-wrap">
        <div class="lb-title">🎉 Final Results</div>
        <div id="lbFinal">Loading…</div>
        <div class="host-actions" style="margin-top:22px;">
          <button class="btn big" id="restartBtn">🔄 Restart Game (Same Room)</button>
        </div>
      </div>
    </div>
    <div class="confetti-layer" id="confettiLayer"></div>`;
  loadFinal();
  document.getElementById('restartBtn').onclick = ()=> restartGame();
}
/* ---- restart / play again ---- */
async function restartGame(){
  if(S.busy) return; S.busy = true;
  const code = S.roomCode;
  // wipe this room's answers, results AND joined players — everyone has to rejoin/rescan
  await fbSet(`rooms/${code}/answers`, null);
  await fbSet(`rooms/${code}/results`, null);
  await fbSet(playersPath(code), null);
  // reset the room back to the lobby, waiting for fresh joins and a fresh start
  await fbSet(metaPath(code), { status:'lobby', qIndex:-1, startedAt:0, duration:QUESTION_MS, revealed:false });
  S.qIndex = -1; S.revealTally = null; S.busy = false;
  S.screen = 'host-lobby';
  render();
}

/* ---- podium celebration sequence: 3rd -> 2nd -> 1st, then the rest ---- */
async function loadFinal(){
  const players = await getAllPlayers(S.roomCode);
  players.sort((a,b)=> b.score-a.score);
  const el = document.getElementById('lbFinal');
  if(!el) return;

  const top3 = players.slice(0,3);
  const rest = players.slice(3);

  if(top3.length===0){
    el.innerHTML = '<p style="color:#fff;text-align:center;">No players</p>';
    return;
  }

  // build podium markup up-front (empty of the "show" class — we add it with a delay per slot)
  const order = [top3[2], top3[1], top3[0]]; // render order left->right: 3rd, 2nd, 1st
  const medals = ['🥉','🥈','🥇'];
  const ranks  = ['rank3','rank2','rank1'];

  const podiumHtml = order.map((p,i)=>{
    if(!p) return '';
    return `
      <div class="podium-slot ${ranks[i]}" data-slot="${i}">
        <div class="medal">${medals[i]}</div>
        <div class="p-name">${escapeHtml(p.name)}</div>
        <div class="p-score">${p.score} pts</div>
        <div class="podium-block"></div>
      </div>`;
  }).join('');

  el.innerHTML = `
    <div class="podium-stage" id="podiumStage">${podiumHtml}</div>
    <div class="rest-list" id="restList"></div>`;

  const slots = Array.from(document.querySelectorAll('#podiumStage .podium-slot'));
  // reveal 3rd, then 2nd, then 1st — building the suspense
  const delays = [200, 1100, 2200];
  slots.forEach((slot, i)=>{
    setTimeout(()=>{
      slot.classList.add('show');
      launchConfettiBurst(30);
      if(slot.classList.contains('rank1')){
        // extra celebratory burst + glow specifically for the winner
        setTimeout(()=>{
          slot.classList.add('winner-pulse');
          launchConfettiBurst(70);
        }, 400);
      }
    }, delays[i] ?? 0);
  });

  // then fade in the rest of the leaderboard below the podium
  if(rest.length){
    setTimeout(()=>{
      const rl = document.getElementById('restList');
      if(!rl) return;
      rl.innerHTML = rest.map((p,i)=>`
        <div class="lb-row" style="animation-delay:${i*0.12}s">
          <div class="lb-rank">#${i+4}</div>
          <div class="lb-name">${escapeHtml(p.name)}</div>
          <div class="lb-score">${p.score}</div>
        </div>`).join('');
    }, 3000);
  }
}

/* lightweight confetti burst, no external libs */
function launchConfettiBurst(count){
  const layer = document.getElementById('confettiLayer');
  if(!layer) return;
  const colors = ['#ffe27a','#d0060a','#1368ce','#26890c','#ffa602','#ffffff'];
  for(let i=0;i<count;i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    const size = 6 + Math.random()*8;
    piece.style.left = Math.random()*100 + 'vw';
    piece.style.width = size+'px';
    piece.style.height = (size*0.4)+'px';
    piece.style.background = colors[Math.floor(Math.random()*colors.length)];
    const duration = 2.2 + Math.random()*1.6;
    piece.style.animationDuration = duration+'s';
    piece.style.animationDelay = (Math.random()*0.3)+'s';
    layer.appendChild(piece);
    setTimeout(()=> piece.remove(), (duration+0.5)*1000);
  }
}

/* ============================= PLAYER: JOIN ============================= */
function renderPlayerJoin(){
  clearListeners();
  const params = new URLSearchParams(location.search);
  const prefillCode = params.get('code') || '';
  app.innerHTML = `
    <div class="center-wrap">
      <div class="panel">
        <img class="panel-logo" src="${LOGO_DATA_URI}" alt="T-Racers MEC logo">
        <h1>Join the game 🎮</h1>
        <p class="sub">You'll answer from this phone — the question itself will show on the big screen only.</p>
        <div class="field"><label>Room code</label><input id="codeIn" maxlength="4" placeholder="0000" value="${prefillCode}"></div>
        <div class="field"><label>Your name</label><input id="nameIn" maxlength="18" placeholder="Enter your name"></div>
        <button class="btn big" id="joinBtn">Join Game</button>
      </div>
    </div>`;
  document.getElementById('joinBtn').onclick = async ()=>{
    const code = document.getElementById('codeIn').value.trim();
    const name = document.getElementById('nameIn').value.trim();
    if(!/^\d{4}$/.test(code)){ alert('Enter a valid 4-digit room code'); return; }
    if(!name){ alert('Enter your name'); return; }
    const m = await fbGet(metaPath(code));
    if(!m){ alert('No game found with that code — check with your instructor'); return; }
    const id = genId();
    const ok = await fbSet(playerPath(code,id), { name, score:0 });
    if(!ok){ alert('Connection error, please try again'); return; }
    S.roomCode = code; S.playerId = id; S.playerName = name; S.meta = m; S.answeredQIndex=-1;
    S.screen = 'player-waiting'; render();
  };
}

/* =============================================================================
   PLAYER SIDE — REALTIME REDESIGN
   All four player screens (waiting / question / answered-wait / result) used
   to each run their own `fbGet(metaPath)` on the global 1-second interval.
   That's exactly what made 30+ students feel sluggish: 30 separate HTTP
   polls every single second, and every screen transition could lag up to
   1 full second behind what actually happened.
   Now there is ONE listener on `meta` per player, opened once when the
   player screen first mounts, that stays alive across waiting -> question
   -> answered-wait -> result -> end and drives every transition itself,
   the instant the host changes the room's state. No interval, no polling,
   no per-second request at all. It scales to any number of players because
   each one just holds a single idle subscription.
   ============================================================================= */
function startPlayerMetaListener(){
  clearListeners();
  const unsub = fbListen(metaPath(S.roomCode), (m)=>{
    if(!m) return;
    S.meta = m;

    if(m.status === 'end'){
      if(S.screen !== 'player-end'){ S.screen = 'player-end'; render(); }
      return;
    }

    if(m.status === 'question'){
      if(!m.revealed){
        // A fresh question is live and we haven't answered/timed-out on it yet.
        if(m.qIndex !== S.answeredQIndex){
          S.qIndex = m.qIndex;
          if(S.screen !== 'player-question'){ S.screen = 'player-question'; render(); }
          return;
        }
        // We already answered this question index -> sit in the "submitted" screen.
        if(S.screen !== 'player-answered-wait'){ S.screen = 'player-answered-wait'; render(); }
        return;
      }
      // Host revealed this question's answer -> fetch our personal result once.
      if(m.revealed && m.qIndex === S.answeredQIndex && S.screen !== 'player-result'){
        fbGet(resultPath(S.roomCode, m.qIndex, S.playerId)).then(res=>{
          S.myResult = res || { correct:false, pts:0, newScore:null, rank:null, total:null };
          S.screen = 'player-result'; render();
        });
        return;
      }
    }

    if(m.status === 'lobby' && S.screen !== 'player-waiting'){
      // e.g. host restarted the game -> back to the waiting room.
      S.answeredQIndex = -1;
      S.screen = 'player-waiting'; render();
    }
  });
  S._unsubs.push(unsub);
}

/* ============================= PLAYER: WAITING ============================= */
function renderPlayerWaiting(){
  app.innerHTML = `
    <div class="name-tag">👤 ${escapeHtml(S.playerName)}</div>
    <div class="player-wait">
      <img class="wait-logo" src="${LOGO_DATA_URI}" alt="T-Racers MEC logo">
      <div class="pulse-dot"></div>
      <h2 id="waitTitle">Waiting for the host to start…</h2>
      <p>Questions will appear here as soon as the game begins — stay ready!</p>
    </div>`;
  // Only (re)attach the listener if one isn't already running for this
  // session — renderPlayerWaiting can be reached again after a restart.
  if(S._unsubs.length===0) startPlayerMetaListener();
}

/* ============================= PLAYER: QUESTION ============================= */
function renderPlayerQuestion(){
  app.innerHTML = `
    <div class="name-tag">👤 ${escapeHtml(S.playerName)}</div>
    <div class="player-shell">
      <div class="mini-timer"><div class="mini-timer-fill" id="miniFill" style="width:100%"></div></div>
      <div class="shape-grid">
        ${SHAPES.map((s,i)=>`<button class="shape-btn" style="background:${s.color}" data-i="${i}">${s.icon}</button>`).join('')}
      </div>
    </div>`;
  document.querySelectorAll('.shape-btn').forEach(btn=>{
    btn.onclick = async ()=>{
      document.querySelectorAll('.shape-btn').forEach(b=> b.disabled = true);
      const i = Number(btn.dataset.i);
      const elapsed = serverNow() - (S.meta.startedAt||serverNow());
      await fbSet(answerPath(S.roomCode, S.qIndex, S.playerId), { choice:i, time: elapsed });
      S.answeredQIndex = S.qIndex;
      S.screen = 'player-answered-wait'; render();
    };
  });
  // Local-only countdown bar: pure UI, driven off the S.meta values we
  // already have from the live listener — no network call in this loop.
  let localTimer = setInterval(()=>{
    if(S.screen!=='player-question' || !S.meta){ clearInterval(localTimer); return; }
    const remaining = Math.max(0, S.meta.duration - (serverNow()-S.meta.startedAt));
    const pct = Math.round((remaining/S.meta.duration)*100);
    const fill = document.getElementById('miniFill');
    if(fill) fill.style.width = pct+'%';
    if(remaining<=0){
      clearInterval(localTimer);
      S.answeredQIndex = S.qIndex;
      S.screen='player-answered-wait'; render();
    }
  }, 200);
  // Local-only cleanup list: does NOT touch the persistent meta listener
  // from startPlayerMetaListener(), which must keep running across every
  // player screen for the whole game.
  S._localTimers.push(()=> clearInterval(localTimer));
}

/* ============================= PLAYER: ANSWERED / WAITING REVEAL ============================= */
function renderPlayerAnsweredWait(){
  app.innerHTML = `
    <div class="name-tag">👤 ${escapeHtml(S.playerName)}</div>
    <div class="player-wait">
      <div class="pulse-dot"></div>
      <h2>Answer submitted ✅</h2>
      <p>Waiting for everyone else to answer…</p>
    </div>`;
}

/* ============================= PLAYER: RESULT ============================= */
function renderPlayerResult(){
  const r = S.myResult || {};
  app.innerHTML = `
    <div class="name-tag">👤 ${escapeHtml(S.playerName)}</div>
    <div class="result-hero ${r.correct?'ok':'bad'}">
      <div class="verdict">${r.correct? 'Correct! ✅' : 'Wrong ❌'}</div>
      <div class="pts">+${r.pts||0}</div>
      <div class="rank-note">Total score: ${r.newScore ?? '—'} ${r.rank? '· Rank #'+r.rank+' of '+r.total : ''}</div>
    </div>`;
}

/* ============================= PLAYER: END ============================= */
function renderPlayerEnd(){
  // Game is fully over for this player — stop the meta listener, nothing
  // left for it to react to.
  clearListeners();
  app.innerHTML = `<div class="final-wrap"><div>Calculating your final result…</div></div>`;
  loadPlayerFinal();
}
async function loadPlayerFinal(){
  const players = await getAllPlayers(S.roomCode);
  players.sort((a,b)=> b.score-a.score);
  const idx = players.findIndex(p=> p.id===S.playerId);
  const me = players[idx] || { score:0 };
  const el = document.querySelector('.final-wrap');
  if(!el) return;
  el.innerHTML = `
    <img class="final-logo" src="${LOGO_DATA_URI}" alt="T-Racers MEC logo">
    <div style="font-size:24px;font-weight:800;">🏁 Game over!</div>
    <div class="big-rank">#${idx>=0? idx+1 : '—'}</div>
    <div class="big-score">Your score: ${me.score} points out of ${players.length} players</div>`;
}

/* ============================= UTIL ============================= */
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* Lightweight C++ syntax highlighter (VS Code "Dark+" style colors) for
   the <div class="code-block"> shown on coding questions. Not a full
   parser — just a single-pass tokenizer (one big alternation regex) so
   generated <span> tags are never re-scanned by a later pass. (An
   earlier multi-pass version re-ran keyword matching over its own
   output HTML, which itself contains the word "class" inside
   class="tok-num" — since "class" is also a C++ keyword, that corrupted
   the markup. Single-pass avoids the whole class of bug.) */
function highlightCpp(code){
  const KEYWORDS = 'if|else|while|for|do|return|class|public|private|protected|virtual|override|new|delete|try|catch|throw|const|static|void|true|false|this|struct|using|namespace|template|typename|break|continue|switch|case|default';
  const TYPES = 'int|float|double|char|bool|string|vector|auto|long|short|unsigned';
  const re = new RegExp(
    '(\\/\\/.*$)' +                          // 1: line comment
    '|("(?:[^"\\\\]|\\\\.)*")' +              // 2: string literal
    '|(\\b\\d+(?:\\.\\d+)?\\b)' +             // 3: number
    `|(\\b(?:${KEYWORDS})\\b)` +              // 4: keyword
    `|(\\b(?:${TYPES})\\b)` +                 // 5: type
    '|(\\b[A-Za-z_]\\w*(?=\\())',             // 6: function-call name
    'gm'
  );
  let out = '', lastIndex = 0, m;
  while ((m = re.exec(code)) !== null){
    out += escapeHtml(code.slice(lastIndex, m.index));
    const esc = escapeHtml(m[0]);
    const cls = m[1] ? 'tok-com' : m[2] ? 'tok-str' : m[3] ? 'tok-num' : m[4] ? 'tok-kw' : m[5] ? 'tok-type' : 'tok-fn';
    out += `<span class="${cls}">${esc}</span>`;
    lastIndex = re.lastIndex;
  }
  out += escapeHtml(code.slice(lastIndex));
  return out;
}

/* =============================================================================
   GLOBAL POLL LOOP — REMOVED.
   The old code here ran a single setInterval every 1 second for the WHOLE
   game, calling one fbGet() (or more) per active screen — meaning every
   host tab AND every one of the (30+) player phones fired its own HTTP
   request roughly once per second, all the time. That constant request
   volume was the main reason the game felt sluggish and got worse as more
   students joined.
   Every one of those calls has now been replaced with a live Firebase
   listener (fbListen) that is opened once per screen/session and pushes
   updates instantly, with zero ongoing request traffic. See:
     - renderHostLobby      -> live players listener
     - renderHostQuestion   -> live meta + live answers listeners
     - startPlayerMetaListener -> single listener driving every player screen
   Nothing left here needs to run on an interval. ============================= */

boot();
</script>
